<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'" />
<title>DeskPet 메모</title>
</head>
<body>
<script>
  // 보이지 않는 어미 창. 여기서 연 메모 창들은 이 창과 렌더러 프로세스를 같이 쓴다 (창마다 프로세스가 뜨지 않게).
  // 창 이름(= 메모 id)으로 메인이 어느 메모인지 안다. 창 모양 · 자리는 메인의 setWindowOpenHandler 가 정한다.
  window.noteHostAPI.onOpen((id) => { window.open('note.html', id); });
</script>
</body>
</html>
