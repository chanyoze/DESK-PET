name: Build macOS app

# 수동 실행 — Actions 탭에서 "Run workflow" 또는 `gh workflow run mac.yml`
#  - bundle 비움: 그림 없는 앱 → 공개 프리릴리스 mac-v버전 (캐릭터는 받는 사람 맥에서 처음 켤 때 받는다)
#  - bundle 채움: 레시피 캐릭터를 앱 안에 넣은 통파일 → 그림이 들어가므로 **릴리스에 올리지 않고**
#    1일짜리 아티팩트로만 남긴다. 받은 뒤 바로 지운다 (gh api -X DELETE .../actions/artifacts/<id>)
on:
  workflow_dispatch:
    inputs:
      preset:
        description: '기본 설정 프리셋'
        default: 'tools/presets/herdier.json'
        required: true
      bundle:
        description: '앱에 넣을 레시피 (예: pokemon/herdier) — 비우면 그림 없는 앱'
        default: ''
        required: false
  # release.yml 이 버전을 올려 푸시했을 때 부른다 (그림 없는 앱 → mac-v버전 프리릴리스 → 앱 업데이트 알림)
  workflow_call:
    inputs:
      preset:
        type: string
        default: 'tools/presets/herdier.json'
        required: false
      bundle:
        type: string
        default: ''
        required: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 빌드 (universal zip, ad-hoc 서명)
        run: node tools/build-mac.js "${{ inputs.preset }}" ${{ inputs.bundle && format('--bundle={0}', inputs.bundle) || '' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 그림 없는 앱 — 아티팩트
        if: ${{ !inputs.bundle }}
        uses: actions/upload-artifact@v4
        with:
          name: DeskPet-mac
          path: dist/mac/*.zip

      - name: 통파일 — 1일짜리 아티팩트만 (릴리스 금지)
        if: ${{ inputs.bundle }}
        uses: actions/upload-artifact@v4
        with:
          name: DeskPet-mac-bundled
          path: dist/mac/*.zip
          retention-days: 1

      - name: 릴리스에 올리기 (그림 없는 앱만, 프리릴리스 mac-v버전)
        if: ${{ !inputs.bundle }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="mac-v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/mac/*.zip --clobber
          else
            gh release create "$TAG" dist/mac/*.zip --prerelease --title "DeskPet for macOS $VER" \
              --notes "맥용 (애플 실리콘 · 인텔). 받은 뒤 응용 프로그램 폴더로 옮기고 터미널에서 한 번: xattr -cr /Applications/DeskPet.app — 캐릭터는 처음 켤 때 인터넷에서 받아 온다 (그림은 이 파일에 없음)."
          fi
